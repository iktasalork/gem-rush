name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npx cap add android

      - name: Set the app icon
        run: |
          if [ -f icon.png ]; then
            mkdir -p assets
            cp icon.png assets/icon-only.png
            npx --yes @capacitor/assets generate --android --iconBackgroundColor '#140a33' --iconBackgroundColorDark '#140a33'
          else
            echo "No icon.png found, using the default icon"
          fi

      - name: Sync the project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: gem-rush-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
